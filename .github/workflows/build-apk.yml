name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Build APK via Capacitor
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-512.png www/

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Quick Sketch" "com.sketch.app" --web-dir www
          npx cap add android

          RES_DIR="android/app/src/main/res"

          # 1. Update legacy PNG icons
          for density in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dir="${density%%:*}"
            size="${density##*:}"
            convert icon-512.png -resize "${size}x${size}" "$RES_DIR/mipmap-$dir/ic_launcher.png"
            convert icon-512.png -resize "${size}x${size}" "$RES_DIR/mipmap-$dir/ic_launcher_round.png"
          done

          # 2. Modern Android Adaptive Icons: replace foreground with your logo padded to 432x432
          mkdir -p "$RES_DIR/drawable"
          mkdir -p "$RES_DIR/drawable-v24"
          convert icon-512.png -resize 280x280 -gravity center -background none -extent 432x432 "$RES_DIR/drawable/ic_launcher_foreground.png"
          cp "$RES_DIR/drawable/ic_launcher_foreground.png" "$RES_DIR/drawable-v24/ic_launcher_foreground.png" 2>/dev/null || true

          # Set adaptive background to clean white
          cat << 'XML' > "$RES_DIR/values/ic_launcher_background.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#FFFFFF</color>
          </resources>
          XML

          # Point anydpi XML explicitly to the foreground png
          for xml_dir in "$RES_DIR/mipmap-anydpi-v26"; do
            mkdir -p "$xml_dir"
            cat << 'XML' > "$xml_dir/ic_launcher.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          XML
            cp "$xml_dir/ic_launcher.xml" "$xml_dir/ic_launcher_round.xml"
          done

          # 3. Bump versionCode and versionName in build.gradle
          sed -i 's/versionCode 1/versionCode 2/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.0.1"/' android/app/build.gradle

          npx cap sync android
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../QuickSketch.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickSketch-APK
          path: QuickSketch.apk
