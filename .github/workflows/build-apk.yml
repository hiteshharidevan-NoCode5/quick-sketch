name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build APK via Capacitor
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-512.png www/

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

          npx cap init "Quick Sketch" "com.sketch.app" --web-dir www
          npx cap add android

          RES="android/app/src/main/res"
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "$RES/$dir"
            cp icon-512.png "$RES/$dir/ic_launcher.png"
            cp icon-512.png "$RES/$dir/ic_launcher_round.png"
            cp icon-512.png "$RES/$dir/ic_launcher_foreground.png"
          done

          cat << 'XML' > "$RES/values/ic_launcher_background.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#FFFFFF</color>
          </resources>
          XML

          sed -i 's/versionCode 1/versionCode 2/g' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.0.1"/g' android/app/build.gradle

          npx cap sync android
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../QuickSketch.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickSketch-APK
          path: QuickSketch.apk
