<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Quick Sketch</title>
  <meta name="theme-color" content="#ffffff">
  <style>
    * { box-sizing: border-box; -webkit-user-select: none; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #ffffff; position: fixed; touch-action: none; font-family: -apple-system, sans-serif; }
    #toolbar {
      position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
      background: rgba(245, 245, 247, 0.96); border-radius: 28px; padding: 6px 12px;
      display: flex; gap: 6px; align-items: center; z-index: 100; box-shadow: 0 3px 12px rgba(0,0,0,0.15);
    }
    input[type="color"] { width: 28px; height: 28px; border: none; border-radius: 50%; cursor: pointer; background: none; }
    button {
      border: none; background: #ffffff; padding: 7px 12px; border-radius: 14px;
      font-size: 12px; font-weight: 600; cursor: pointer; color: #1c1c1e;
    }
    button.active { background: #008080 !important; color: #ffffff !important; }
    button:disabled { opacity: 0.35; }
    canvas { display: block; width: 100vw; height: 100vh; background: #ffffff; touch-action: none; }
    #previewModal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      z-index: 999; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
    }
    #previewModal img { max-width: 85vw; max-height: 70vh; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    #previewModal p { color: #fff; margin-top: 12px; font-size: 14px; }
    #previewModal button { margin-top: 15px; background: #008080; color: #fff; padding: 10px 20px; border-radius: 20px; }
  </style>
</head>
<body>
  <div id="toolbar">
    <input type="color" id="colorPicker" value="#008080">
    <button id="eraserBtn">Eraser</button>
    <button id="undoBtn" disabled>↖+ Before</button>
    <button id="redoBtn" disabled>↻, After</button>
    <button id="clearBtn">Clear</button>
    <button id="saveBtn" style="background: #008080; color: #fff;">Save PNG</button>
  </div>
  <canvas id="canvas"></canvas>

  <div id="previewModal">
    <img id="previewImg" src="" alt="Sketch Preview">
    <p>Long-press the image above to save to Photos</p>
    <button id="closeModal">Close</button>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const colorPicker = document.getElementById('colorPicker');
    const eraserBtn = document.getElementById('eraserBtn');
    const undoBtn = document.getElementById('undoBtn');
    const redoBtn = document.getElementById('redoBtn');
    const clearBtn = document.getElementById('clearBtn');
    const saveBtn = document.getElementById('saveBtn');
    const previewModal = document.getElementById('previewModal');
    const previewImg = document.getElementById('previewImg');
    const closeModal = document.getElementById('closeModal');

    let isDrawing = false;
    let isEraser = false;
    let lastX = 0, lastY = 0;
    let history = [];
    let redoStack = [];

    function updateButtons() {
      undoBtn.disabled = history.length <= 1;
      redoBtn.disabled = redoStack.length === 0;
    }

    function saveState() {
      if (history.length >= 30) history.shift();
      history.push(canvas.toDataURL());
      redoStack = [];
      updateButtons();
    }

    function restoreState(url) {
      const img = new Image();
      img.onload = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);
      };
      img.src = url;
    }

    function setupFactory() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      saveState();
    }
    setupFactory();

    function getCoords(ev) {
      if (ev.touches && ev.touches[0]) {
        return { x: ev.touches[0].clientX, y: ev.touches[0].clientY };
      }
      return { x: ev.clientX, y: ev.clientY };
    }

    function start(e) {
      isDrawing = true;
      const pos = getCoords(e);
      lastX = pos.x; lastY = pos.y;
    }

    function draw(e) {
      if (!isDrawing) return;
      const pos = getCoords(e);
      ctx.beginPath();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      if (isEraser) {
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 38;
      } else {
        ctx.strokeStyle = colorPicker.value;
        ctx.lineWidth = 4;
      }
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
      lastX = pos.x; lastY = pos.y;
    }

    function stop() {
      if (isDrawing) {
        isDrawing = false;
        saveState();
      }
    }

    canvas.addEventListener('touchstart', (ev) => { ev.preventDefault(); start(ev); }, { passive: false });
    canvas.addEventListener('touchmove', (ev) => { ev.preventDefault(); draw(ev); }, { passive: false });
    canvas.addEventListener('touchend', (ev) => { ev.preventDefault(); stop(); }, { passive: false });

    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stop);

    eraserBtn.onclick = () => {
      isEraser = !isEraser;
      eraserBtn.classList.toggle('active', isEraser);
      eraserBtn.textContent = isEraser ? 'Pen' : 'Eraser';
    };

    colorPicker.oninput = () => {
      isEraser = false;
      eraserBtn.classList.remove('active');
      eraserBtn.textContent = 'Eraser';
    };

    undoBtn.onclick = () => {
      if (history.length > 1) {
        redoStack.push(history.pop());
        restoreState(history[history.length - 1]);
        updateButtons();
      }
    };

    redoBtn.onclick = () => {
      if (redoStack.length > 0) {
        const st = redoStack.pop();
        history.push(st);
        restoreState(st);
        updateButtons();
      }
    };

    clearBtn.onclick = () => {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      saveState();
    };

    saveBtn.onclick = async () => {
      const dataUrl = canvas.toDataURL('image/png');
      const filename = 'sketch-' + Date.now() + '.png';

      // 1. Capacitor Native Bridge check
      const cap = window.Capacitor;
      if (cap && cap.isPluginAvailable && cap.isPluginAvailable('Filesystem')) {
        try {
          const b64 = dataUrl.split(',')[1];
          const file = await cap.Plugins.Filesystem.writeFile({
            path: filename,
            data: b64,
            directory: 'CACHE'
          });
          if (cap.isPluginAvailable('Share')) {
            await cap.Plugins.Share.share({ title: 'Quick Sketch', url: file.uri });
            return;
          }
        } catch (e) { console.log(e); }
      }

      // 2. Web Share API with File support
      if (navigator.canShare) {
        try {
          const res = await fetch(dataUrl);
          const blob = await res.blob();
          const file = new File([blob], filename, { type: 'image/png' });
          if (navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: 'Quick Sketch' });
            return;
          }
        } catch (err) {}
      }

      // 3. Fail-safe Fallback: Display saveable preview modal
      previewImg.src = dataUrl;
      previewModal.style.display = 'flex';
    };

    closeModal.onclick = () => {
      previewModal.style.display = 'none';
    };
  </script>
</body>
</html>
