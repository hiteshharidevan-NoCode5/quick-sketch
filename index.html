<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Quick Sketch</title>
<meta name="theme-color" content="#ffffff">
<style>
  * { box-sizing: border-box; -webkit-user-select: none; margin: 0; padding: 0; }
  body, html { width: 100%; height: 100%; overflow: hidden; background: #ffffff; position: fixed; touch-action: none; }
  #toolbar {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
    background: rgba(245, 245, 247, 0.96); border-radius: 28px; padding: 6px 12px;
    display: flex; gap: 6px; align-items: center; z-index: 100; box-shadow: 0 3px 12px rgba(0,0,0,0.15);
  }
  input[type="color"] { width: 28px; height: 28px; border: none; border-radius: 50%; cursor: pointer; background: none; }
  button {
    border: none; background: #ffffff; padding: 7px 12px; border-radius: 14px;
    font-size: 12px; font-weight: 600; cursor: pointer; color: #1c1c1e;
  }
  button.active { background: #008080 !important; color: #ffffff !important; }
  button:disabled { opacity: 0.35; }
  canvas { display: block; width: 100vw; height: 100vh; background: #ffffff; }
</style>
</head>
<body>
<div id="toolbar">
  <input type="color" id="colorPicker" value="#008080">
  <button id="eraserBtn">Eraser</button>
  <button id="undoBtn" disabled>â†Ö Before</button>
  <button id="redoBtn" disabled>â†· After</button>
  <button id="clearBtn">Clear</button>
  <button id="saveBtn" style="background: #008080; color: #fff;">Save PNG</button>
</div>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const colorPicker = document.getElementById('colorPicker');
const eraserBtn = document.getElementById('eraserBtn');
const undoBtn = document.getElementById('undoBtn');
const redoBtn = document.getElementById('redoBtn');
const clearBtn = document.getElementById('clearBtn');
const saveBtn = document.getElementById('saveBtn');

let painting = false, isEraser = false, history = [], redoStack = [];
let lastX = 0, lastY = 0;

function updateButtons() {
  undoBtn.disabled = history.length <= 1;
  redoBtn.disabled = redoStack.length === 0;}

function saveState() {
  if (history.length >= 30) history.shift();
  history.push(canvas.toDataURL());
  redoStack = [];
  updateButtons();
}

function restoreState(url) {
  const img = new Image();
  img.onload = () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0);
  };
  img.src = url;
}

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  saveState();
}
resize();

function getPos(e) {
  const t = (e.touches && e.touches[0]) ? e.touches[0] : e;
  return { x: t.clientX, y: t.clientY };
}

function startLine(e) {
  painting = true;
  const p = getPos(e);
  lastX = p.x; lastY = p.y;
  drawLine(e);
}

function drawLine(e) {
  if (!painting) return;
  const p = getPos(e);
  ctx.save();
  ctx.beginPath();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (isEraser) {
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 36;
  } else {
    ctx.strokeStyle = colorPicker.value;
    ctx.lineWidth = 4;
  }
  ctx.moveTo(lastX, lastY);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
  ctx.restore();
  lastX = p.x; lastY = p.y;
}

function stopLine() {
  if (painting) {
    painting = false;
    saveState();
  }
}

canvas.addEventListener('touchstart', e => { e.preventDefault(); startLine(e); }, { passive: false });
canvas.addEventListener('touchmove', e => { e.preventDefault(); drawLine(e); }, { passive: false });
canvas.addEventListener('touchend', e => { e.preventDefault(); stopLine(); }, { passive: false });
canvas.addEventListener('mousedown', startLine);
canvas.addEventListener('mousemove', drawLine);
canvas.addEventListener('mouseup', stopLine);

eraserBtn.onclick = () => {
  isEraser = !isEraser;
  eraserBtn.classList.toggle('active', isEraser);
  eraserBtn.textContent = isEraser ? 'Pen' : 'Eraser';
};

colorPicker.oninput = () => {
  isEraser = false;
  eraserBtn.classList.remove('active');
  eraserBtn.textContent = 'Eraser';
};

undoBtn.onclick = () => {
  if (history.length > 1) {
    redoStack.push(history.pop());
    restoreState(history[history.length - 1]);
    updateButtons();
  }
};

redoBtn.onclick = () => {
  if (rdoStack.length > 0) {
    const st = redoStack.pop();
    history.push(st);
    restoreState(st);
    updateButtons();
  }
};

clearBtn.onclick = () => {
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  saveState();
};
saveBtn.onclick = async () => {
  const dataUrl = canvas.toDataURL('image/png');
  const filename = 'sketch-' + Date.now() + '.png';
  if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem) {
    try {
      const b64 = dataUrl.split(',')[1];
      const file = await window.Capacitor.Plugins.Filesystem.writeFile({ path: filename, data: b64, directory: 'CACHE' });
      await window.Capacitor.Plugins.Share.share({ title: 'Quick Sketch', url: file.uri });
      return;
    } catch (err) {}
  }
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
};
</script>
</body>
</html>
